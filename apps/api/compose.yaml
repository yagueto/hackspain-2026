name: crisis
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: crisis
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis -d crisis"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  pgdata:
