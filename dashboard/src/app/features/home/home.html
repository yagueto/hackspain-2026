<h1 class="sr-only">Centro de coordinación de emergencias</h1>
<p class="sr-only" role="alert" aria-atomic="true">{{ log.notification() }}</p>
<div class="home-workspace">
  <div class="dashboard-grid">
    <app-operational-map
      [addresses]="addresses()"
      [locations]="locations()"
      [selectedIncidentId]="selectedIncidentId()"
      [selectedUnitId]="selectedUnitId()"
      [visibleUnitIds]="detail() ? null : visibleUnitIds()"
      [focusedLocationId]="detail() ? (selectedUnitId() ?? selectedIncidentId()) : null"
      (unitSelected)="selectUnit($event)"
      (incidentSelected)="selectIncident($event)"
    />
    <app-split-pane />
    <div class="operations-column" [class.detail-open]="detail()">
      @if (detail()) {
        <a class="back-button" routerLink="/" aria-label="Volver a incidencias y recursos">
          <app-icon name="chevron" /> Volver
        </a>
        @if (detail() === 'incident') {
          <app-incidents [embedded]="true" (unitLocated)="locateUnit($event)" />
        } @else {
          <app-resources [embedded]="true" />
        }
      }
      <div class="overview-widgets" [hidden]="!!detail()">
        <app-incident-list
          [incidents]="log.prioritizedIncidents()"
          [selectedId]="selectedIncidentId()"
          [attention]="log.attention()"
          (incidentSelected)="selectIncident($event)"
          (responseRequested)="openIncident($event)"
        />
        <app-service-feed
          [communications]="communications()"
          [resources]="projectedUnits()"
          [selectedIncidentId]="selectedIncidentId()"
          [selectedUnitId]="selectedUnitId()"
          (unitSelected)="selectUnit($event)"
          (visibleUnitsChanged)="visibleUnitIds.set($event)"
        />
      </div>
    </div>
  </div>
</div>
