<section class="panel incident-panel" aria-labelledby="incidents-title">
  <div class="panel-heading">
    <div class="heading-title">
      <h2 id="incidents-title">Incidencias</h2>
      <span class="count-badge">{{ incidents().length }}</span>
    </div>
    <span class="section-label">EN SEGUIMIENTO</span>
  </div>
  <div
    id="incidents-list"
    class="incident-list"
    [appPaginatedList]="incidents()"
    [itemKey]="incidentKey"
    [selectedKey]="selectedId()"
    #pager="paginatedList"
  >
    @for (incident of pager.visibleItems(); track incident.id) {
      <article class="incident-row" [class.selected]="selectedId() === incident.id">
        <button
          type="button"
          class="incident-select"
          [attr.aria-label]="'Mostrar ' + incident.id + ' en el mapa'"
          [attr.aria-pressed]="selectedId() === incident.id"
          (click)="incidentSelected.emit(incident.id)"
        >
          <span class="incident-icon"><app-icon [name]="incident.icon" /></span>
          <span class="incident-info">
            <span class="incident-name">
              <strong>{{ incident.id }}</strong
              ><span class="separator">·</span>{{ incident.title }}
            </span>
            <span class="status-badge">
              <span>{{ incident.priority }}</span
              ><span class="status-dot"></span>{{ incident.status }}
            </span>
            <span class="incident-area">{{ incident.area }}</span>
          </span>
        </button>
        <a
          class="detail-link"
          routerLink="/incidencias"
          [queryParams]="{ incidencia: incident.id }"
          [attr.aria-label]="'Ver detalles de ' + incident.id"
          title="Ver detalles"
        >
          <span>Detalles</span><app-icon name="chevron" />
        </a>
      </article>
    } @empty {
      <p class="empty-state">No hay incidencias en seguimiento.</p>
    }
  </div>
  <app-pagination
    [page]="pager.pageIndex()"
    [pageCount]="pager.pageCount()"
    label="incidencias"
    controls="incidents-list"
    (pageChanged)="pager.goToPage($event)"
  />
</section>
