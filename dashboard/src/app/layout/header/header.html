<header class="topbar">
  <span class="brand">CrisisOS</span>
  <div class="header-meta">
    <button
      class="theme-toggle"
      type="button"
      aria-label="Modo oscuro"
      [attr.aria-pressed]="theme.current() === 'dark'"
      [title]="theme.current() === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro'"
      (click)="theme.toggle()"
    >
      <app-icon name="moon" />
    </button>
    <time
      class="date"
      [attr.datetime]="now().toISOString()"
      [attr.aria-label]="date() + ' ' + time()"
    >
      <span class="full-date">{{ date() }}</span>
      <span class="compact-date">{{ compactDate() }}</span>
      <span class="clock">{{ time() }}</span>
    </time>
    <div class="profile">
      <span class="profile-name">Ander</span>
      <span class="avatar" aria-hidden="true">A</span>
    </div>
  </div>
</header>
