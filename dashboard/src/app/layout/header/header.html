<header class="topbar">
  <a
    class="brand"
    routerLink="/"
    aria-label="Centro de coordinación"
    title="Centro de coordinación"
  >
    <app-icon name="radio" />
  </a>
  <nav aria-label="Navegación principal">
    @for (item of navigation; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored',
        }"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
    <button
      id="log-toggle"
      type="button"
      [class.active]="log.open()"
      [attr.aria-expanded]="log.open()"
      aria-controls="operation-log"
      (click)="openLog()"
    >
      Logs
      @if (log.pendingCount()) {
        <span
          class="pending-count"
          [attr.aria-label]="log.pendingCount() + ' preguntas pendientes'"
          >{{ log.pendingCount() }}</span
        >
      }
    </button>
  </nav>
  <div class="header-meta">
    <button
      type="button"
      class="connection-indicator"
      [class.failed]="operations.connection() !== 'live'"
      [attr.aria-label]="'Conexión con la API: ' + connectionLabel() + '; actualizar'"
      [title]="operations.error() || 'Actualizar estado operativo'"
      (click)="operations.refresh()"
    >
      {{ connectionLabel() }}
    </button>
    <span class="demo-indicator"><span></span> {{ operations.modeLabel() }}</span>
    <div class="autonomy" role="group" aria-label="Control de autonomía del agente">
      <span class="autonomy-state" [class.stopped]="paused()">
        {{ autonomyLabel() }}
      </span>
      <label class="operator-key"
        ><span class="sr-only">Clave de operador</span>
        <input
          type="password"
          autocomplete="off"
          placeholder="Clave de operador"
          [value]="operations.operatorKey()"
          (input)="operations.operatorKey.set($any($event.target).value)"
      /></label>
      <button
        type="button"
        class="panic"
        [class.resume]="paused()"
        [disabled]="
          busy() ||
          !operations.operatorKey() ||
          !operations.snapshot()?.agent ||
          (paused() && !operations.meta())
        "
        (click)="toggleAutonomy()"
      >
        {{ paused() ? 'Reactivar autonomía' : 'PARADA DE EMERGENCIA' }}
      </button>
    </div>
    @if (message()) {
      <span role="alert" class="autonomy-message">{{ message() }}</span>
    }
    <time class="date" [attr.datetime]="now().toISOString()"
      >{{ date() }} <span class="clock">{{ time() }}</span></time
    >
    <details class="profile" #profile (keydown.escape)="profile.open = false">
      <summary aria-label="Menú de Ander. Cambiar tema">
        <span class="profile-name">Ander</span>
        <span class="avatar" aria-hidden="true">A</span>
      </summary>
      <div class="profile-menu" aria-label="Apariencia">
        <span class="menu-label">Apariencia</span>
        <button
          type="button"
          [attr.aria-pressed]="theme.current() === 'light'"
          (click)="theme.set('light')"
        >
          <app-icon name="sun" /> Tema claro
        </button>
        <button
          type="button"
          [attr.aria-pressed]="theme.current() === 'dark'"
          (click)="theme.set('dark')"
        >
          <app-icon name="moon" /> Tema oscuro
        </button>
      </div>
    </details>
  </div>
</header>
