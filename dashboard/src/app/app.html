<a class="skip-link" href="#main-content">Saltar al contenido</a>
<app-header />
<main id="main-content" tabindex="-1"><router-outlet /></main>
@if (demoNoticeOpen()) {
  <aside class="demo-notice" aria-labelledby="demo-notice-title">
    <div role="status">
      <h2 id="demo-notice-title">Aviso de demostración</h2>
      <p>Este mockup muestra datos ficticios con fines ilustrativos.</p>
      <p class="demo-shortcut">Pulsa <kbd>Espacio</kbd> para avanzar la simulación.</p>
    </div>
    <button
      class="demo-notice-close"
      type="button"
      aria-label="Cerrar aviso de demostración"
      (click)="demoNoticeOpen.set(false)"
    >
      <app-icon name="close" />
    </button>
  </aside>
}
<footer class="statusbar">
  <span
    class="connection"
    [class.unstable]="!connection.stable()"
    role="status"
    aria-live="polite"
    title="Conectividad del navegador y recepción de eventos."
  >
    {{ connection.stable() ? 'Conexión estable' : 'Conexión inestable' }}
    <span class="signal-bars" aria-hidden="true">
      @for (bar of [1, 2, 3]; track bar) {
        <span [class.active]="bar <= connection.bars()"></span>
      }
    </span>
  </span>
</footer>
